<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="ad.size" content="width=1080,height=1920">
<title>Plyable_Snap_16869_RSFR_Serials</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 9:16 stage, fits any screen (dvh fallback for mobile browser bars) */
#game {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    overflow: hidden;
    background: #000;
    isolation: isolate;
    transform: translate3d(0, 0, 0);
}

@supports (height: 100dvh) {
    #game {
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
    }
}

#loader {
    position: absolute;
    inset: 0;
    z-index: 300;
    background: #000;
    transition: opacity .35s ease;
}

#loader.done {
    opacity: 0;
    pointer-events: none;
}

.scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
    transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1);
}

.scene.active {
    opacity: 1;
    pointer-events: auto;
}

.scene-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
}

#finalImage,
.selected-scene,
#steamLayer img.steam-img {
    object-position: 50% 50%;
}

#choiceScene .scene-image {
    transform: scale(1.001);
    transition: transform 5s cubic-bezier(.2,.7,.2,1);
}

#choiceScene.active .scene-image {
    transform: scale(1.035);
}

/* ---------- Choice scene ---------- */

.choice-title {
    position: absolute;
    left: 50%;
    top: 9%;
    transform: translateX(-50%) translateY(-15px) scale(.88);
    z-index: 10;
    width: 85%;
    max-width: 900px;
    opacity: 0;
    pointer-events: none;
    transition: transform .7s cubic-bezier(.2,1.35,.35,1), opacity .4s ease;
}

.choice-title img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.25));
}

#choiceScene.active .choice-title {
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 1;
    transition-delay: .15s;
}

.girl-hit {
    position: absolute;
    z-index: 15;
    cursor: pointer;
    touch-action: none;
    transition: transform .2s ease, filter .2s ease;
}

#girlAHit { left: 5%;  top: 23%; width: 48%; height: 59%; }
#girlBHit { left: 48%; top: 22%; width: 47%; height: 62%; }

.girl-hit:active { transform: scale(.97); }

.girl-hit.selected { animation: selectedGirl .45s ease forwards; }

@keyframes selectedGirl {
    0%   { transform: scale(1);     filter: brightness(1); }
    45%  { transform: scale(1.035); filter: brightness(1.18); }
    100% { transform: scale(1.015); filter: brightness(1.08); }
}

/* ---------- Tap hint ---------- */

.tap {
    position: absolute;
    width: 19%;
    aspect-ratio: 1;
    z-index: 30;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity .25s ease, transform .25s ease;
}

.tap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 5px 12px rgba(0,0,0,.3));
    animation: tapPulse 1.15s ease-in-out infinite;
}

@keyframes tapPulse {
    0%, 100% { transform: scale(.88); opacity: .75; }
    50%      { transform: scale(1.08); opacity: 1; }
}

.tap::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 115%;
    height: 115%;
    transform: translate(-50%, -50%) scale(.65);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75);
    opacity: 0;
    animation: tapRing 1.4s ease-out infinite;
    pointer-events: none;
}

@keyframes tapRing {
    0%   { transform: translate(-50%, -50%) scale(.65); opacity: .65; }
    100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0; }
}

.tap.hide {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.45);
}

.tap.hide::after { animation: none; }

#tapA { left: 35%; top: 51%; }
#tapB { left: 69%; top: 56%; }

/* ---------- Girl scenes ---------- */

.selected-scene {
    transform: scale(1.045);
    transition: transform 1.2s cubic-bezier(.2,.7,.2,1);
}

.scene.active .selected-scene { transform: scale(1); }

.bubble-img {
    position: absolute;
    z-index: 20;
    top: 10%;
    left: 50%;
    transform: translateX(-50%) translateY(-10px) scale(.72);
    opacity: 0;
    width: 72%;
    max-width: 780px;
    pointer-events: none;
    transition: opacity .4s ease, transform .65s cubic-bezier(.2,1.35,.35,1);
}

.bubble-img img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.25));
}

.scene.active .bubble-img {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: .25s;
}

.bucket-hit {
    position: absolute;
    z-index: 25;
    left: 16%;
    top: 67%;
    width: 44%;
    height: 25%;
    cursor: pointer;
    touch-action: none;
}

.bucket-hit::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80%;
    height: 80%;
    transform: translate(-50%, -50%) scale(.8);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.14), transparent 65%);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
}

.bucket-hit:active::after {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.bucket-tap { left: 20%; top: 78%; width: 20%; }

/* ---------- Steam ---------- */

#steamLayer {
    position: absolute;
    inset: -12%;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transform-origin: center center;
    transition: opacity .65s ease, transform 1.4s cubic-bezier(.2,.8,.2,1);
}

#steamLayer img.steam-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#steamLayer.level-20  { opacity: .20; }
#steamLayer.level-70  { opacity: .72; }
#steamLayer.level-100 { opacity: 1; }

#steamLayer.rising {
    animation: steamRise 1.55s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes steamRise {
    0%   { transform: translateY(18%) scale(.94); }
    45%  { transform: translateY(5%) scale(1.01); }
    100% { transform: translateY(-4%) scale(1.06); }
}

#steamBurst {
    position: absolute;
    inset: 0;
    z-index: 45;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 70%,
        rgba(255,255,255,.75) 0%,
        rgba(255,255,255,.35) 15%,
        transparent 55%);
}

#steamBurst.play { animation: steamBurst .65s ease-out; }

@keyframes steamBurst {
    0%   { opacity: 0; transform: scale(.65); }
    20%  { opacity: .8; }
    100% { opacity: 0; transform: scale(1.35); }
}

#particles {
    position: absolute;
    inset: 0;
    z-index: 41;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle,
        rgba(255,255,255,.7) 0%,
        rgba(255,255,255,.18) 42%,
        transparent 72%);
    opacity: 0;
    will-change: transform, opacity;
}

.particle.animate {
    animation: particleFloat var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
}

@keyframes particleFloat {
    0%   { transform: translate(0, 35px) scale(.55); opacity: 0; }
    15%  { opacity: var(--op); }
    50%  { transform: translate(var(--x), -45px) scale(1); opacity: var(--op); }
    85%  { opacity: var(--op); }
    100% { transform: translate(calc(var(--x) * 1.4), -100px) scale(1.15); opacity: 0; }
}

.steam-particle {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,.8);
    pointer-events: none;
    animation: steamParticle .8s ease-out forwards;
}

@keyframes steamParticle {
    0%   { transform: translate(0, 0) scale(.4); opacity: .9; }
    100% { transform: translate(var(--px), var(--py)) scale(1.4); opacity: 0; }
}

/* ---------- Final scene ---------- */

#finalScene { z-index: 30; }

#finalImage {
    transform: scale(1.04);
    transition: transform 2s cubic-bezier(.2,.7,.2,1);
}

#finalScene.active #finalImage { transform: scale(1); }

#finalUI {
    position: absolute;
    inset: 0;
    z-index: 70;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s ease;
}

#finalUI.visible { opacity: 1; }

.final-title {
    position: absolute;
    z-index: 75;
    top: 7%;
    left: 50%;
    transform: translateX(-50%) translateY(-20px) scale(.82);
    width: 84%;
    max-width: 880px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .65s cubic-bezier(.2,1.35,.35,1);
}

.final-title img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 7px 14px rgba(0,0,0,.35));
}

#finalUI.visible .final-title {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    transition-delay: .1s;
}

.cta-button {
    position: absolute;
    z-index: 80;
    left: 50%;
    top: 62%;
    transform: translate(-50%, -50%) scale(.65);
    width: 72%;
    max-width: 680px;
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .6s cubic-bezier(.2,1.35,.35,1);
}

.cta-button img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.3));
}

#finalUI.show-cta .cta-button {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    animation: ctaPulse 1.25s ease-in-out infinite;
}

@keyframes ctaPulse {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(1) drop-shadow(0 8px 12px rgba(0,0,0,.25));
    }
    50% {
        transform: translate(-50%, -50%) scale(1.045);
        filter: brightness(1.08)
                drop-shadow(0 0 18px rgba(255,255,255,.7))
                drop-shadow(0 8px 12px rgba(0,0,0,.3));
    }
}

.cta-button:active { transform: translate(-50%, -50%) scale(.94) !important; }

#ctaGlow {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 75%;
    height: 18%;
    transform: translate(-50%, -50%) scale(.8);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.38), transparent 68%);
    filter: blur(12px);
    opacity: 0;
    z-index: 72;
    pointer-events: none;
}

#finalUI.show-cta #ctaGlow { animation: ctaGlowPulse 1.25s ease-in-out infinite; }

@keyframes ctaGlowPulse {
    0%, 100% { opacity: .25; transform: translate(-50%, -50%) scale(.85); }
    50%      { opacity: .65; transform: translate(-50%, -50%) scale(1.05); }
}

/* ---------- Sound button ---------- */

.sound-button {
    position: absolute;
    z-index: 100;
    top: max(2.5%, env(safe-area-inset-top, 0px));
    right: 3%;
    width: 11%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.9);
    background: rgba(0,0,0,.32);
    color: #fff;
    font-size: clamp(16px, 4vw, 35px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    transition: transform .15s ease, background .15s ease;
}

.sound-button:active {
    transform: scale(.88);
    background: rgba(0,0,0,.55);
}

/* ---------- FX ---------- */

#flash {
    position: absolute;
    inset: 0;
    z-index: 200;
    background: #fff;
    opacity: 0;
    pointer-events: none;
}

#flash.play { animation: flash .32s ease-out; }

@keyframes flash {
    0%   { opacity: 0; }
    18%  { opacity: .85; }
    100% { opacity: 0; }
}

#game.shake { animation: screenShake .35s ease; }

@keyframes screenShake {
    0%, 100% { transform: translate3d(0, 0, 0); }
    20% { transform: translate3d(-3px, 2px, 0); }
    40% { transform: translate3d(4px, -2px, 0); }
    60% { transform: translate3d(-3px, -1px, 0); }
    80% { transform: translate3d(2px, 2px, 0); }
}

img, button { -webkit-user-drag: none; }

@media (prefers-reduced-motion: reduce) {
    .particle, .tap::after { display: none; }
    #game.shake { animation: none; }
}
</style>
</head>

<body>

<div id="game">

    <section id="choiceScene" class="scene active">
        <img class="scene-image" data-asset="scene1" alt="" draggable="false">

        <div class="choice-title">
            <img data-asset="textChoice" alt="" draggable="false">
        </div>

        <div id="girlAHit" class="girl-hit"></div>
        <div id="girlBHit" class="girl-hit"></div>

        <div id="tapA" class="tap"><img data-asset="tap" alt="" draggable="false"></div>
        <div id="tapB" class="tap"><img data-asset="tap" alt="" draggable="false"></div>
    </section>

    <section id="girlAScene" class="scene">
        <img class="scene-image selected-scene" data-asset="scene2a" alt="" draggable="false">
        <div class="bubble-img"><img data-asset="textSteam" alt="" draggable="false"></div>
        <div id="bucketA" class="bucket-hit"></div>
        <div class="tap bucket-tap"><img data-asset="tap" alt="" draggable="false"></div>
    </section>

    <section id="girlBScene" class="scene">
        <img class="scene-image selected-scene" data-asset="scene2b" alt="" draggable="false">
        <div class="bubble-img"><img data-asset="textSteam" alt="" draggable="false"></div>
        <div id="bucketB" class="bucket-hit"></div>
        <div class="tap bucket-tap"><img data-asset="tap" alt="" draggable="false"></div>
    </section>

    <section id="finalScene" class="scene">
        <img id="finalImage" class="scene-image" alt="" draggable="false">
    </section>

    <div id="steamLayer">
        <img class="steam-img" data-asset="steamWater" alt="" draggable="false">
    </div>

    <div id="steamBurst"></div>
    <div id="particles"></div>

    <div id="finalUI">
        <div class="final-title"><img data-asset="textFinal" alt="" draggable="false"></div>
        <div id="ctaGlow"></div>
        <button class="cta-button" id="ctaButton" type="button">
            <img data-asset="btnCta" alt="Continue" draggable="false">
        </button>
    </div>

    <div id="flash"></div>

    <button id="soundButton" class="sound-button" type="button" aria-label="Toggle sound">🔊</button>

    <div id="loader"></div>

</div>

<script>
(function () {
"use strict";

/* ============================================================
   CONFIG
============================================================ */

var CTA_URL = "https://hanimax.com/serials/red-heads-first-ride/1";

var IMAGES = {
    scene1:     "assets/scene-1.webp",
    scene2a:    "assets/scene-2-a.webp",
    scene2b:    "assets/scene-2-b.webp",
    scene3a:    "assets/scene-3-a.webp",
    scene3b:    "assets/scene-3-b.webp",
    steamWater: "assets/steam-water.webp",
    tap:        "assets/tap.webp",
    textChoice: "assets/text-choice.webp",
    textSteam:  "assets/text-steam.webp",
    textFinal:  "assets/text-final.webp",
    btnCta:     "assets/btn-cta.webp"
};

var AUDIO = {
    sauna:    "assets/audio/sauna.mp3",
    select:   "assets/audio/select.mp3",
    steam:    "assets/audio/steam.mp3",
    reaction: "assets/audio/reaction-a.mp3"
};

var STEAM_TO_70_DURATION = 900;
var STEAM_HOLD_BEFORE_FINAL = 700;
var TRANSITION_DURATION = 350;
var LOAD_TIMEOUT = 5000;

var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
var PARTICLE_COUNT = IS_MOBILE ? 14 : 28;

/* ============================================================
   ELEMENTS
============================================================ */

function $(id) { return document.getElementById(id); }

var game        = $("game");
var loader      = $("loader");
var choiceScene = $("choiceScene");
var girlAScene  = $("girlAScene");
var girlBScene  = $("girlBScene");
var finalScene  = $("finalScene");
var finalImage  = $("finalImage");
var finalUI     = $("finalUI");
var steamLayer  = $("steamLayer");
var steamBurst  = $("steamBurst");
var particlesEl = $("particles");
var flash       = $("flash");
var tapA        = $("tapA");
var tapB        = $("tapB");
var soundButton = $("soundButton");
var ctaButton   = $("ctaButton");
var girlAHit    = $("girlAHit");
var girlBHit    = $("girlBHit");
var bucketA     = $("bucketA");
var bucketB     = $("bucketB");

/* ============================================================
   STATE
============================================================ */

var selectedGirl = null;
var audioUnlocked = false;
var soundEnabled = true;
var steamPlaying = false;
var steamSoundPlayed = false;
var ctaOpened = false;
var particlesCreated = false;
var saunaVolume = 0.22;
var timers = [];

function later(fn, ms) {
    var id = setTimeout(fn, ms);
    timers.push(id);
    return id;
}

/* ============================================================
   ASSETS LOADING
============================================================ */

function applyImages() {
    var nodes = document.querySelectorAll("img[data-asset]");
    for (var i = 0; i < nodes.length; i++) {
        var key = nodes[i].getAttribute("data-asset");
        if (IMAGES[key]) nodes[i].src = IMAGES[key];
    }
}

function loadImage(src) {
    return new Promise(function (resolve) {
        var img = new Image();
        img.onload = img.onerror = function () { resolve(); };
        img.src = src;
    });
}

function preloadAll() {
    applyImages();

    var jobs = [];
    Object.keys(IMAGES).forEach(function (k) { jobs.push(loadImage(IMAGES[k])); });

    var timeout = new Promise(function (resolve) { setTimeout(resolve, LOAD_TIMEOUT); });

    return Promise.race([Promise.all(jobs), timeout]);
}

/* ============================================================
   AUDIO
============================================================ */

var sounds = {};

Object.keys(AUDIO).forEach(function (name) {
    var a = new Audio();
    a.preload = "auto";
    a.setAttribute("playsinline", "");
    a.setAttribute("webkit-playsinline", "");
    a.src = AUDIO[name];
    sounds[name] = a;
});

sounds.sauna.loop = true;

function safePlay(audio) {
    try {
        var p = audio.play();
        if (p && p.catch) p.catch(function () {});
    } catch (e) {}
}

function playSound(name, volume) {
    if (!soundEnabled || !audioUnlocked) return;

    var audio = sounds[name];
    if (!audio) return;

    try {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audio.volume = volume == null ? 1 : volume;
        safePlay(audio);
    } catch (e) {}
}

function startSauna() {
    var s = sounds.sauna;
    if (!soundEnabled) return;

    s.muted = false;
    s.volume = saunaVolume;

    if (s.paused) safePlay(s);
}

function setSaunaVolume(v) {
    saunaVolume = v;
    try { sounds.sauna.volume = v; } catch (e) {}
}


function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;

    ["steam", "reaction"].forEach(function (name) {
        var a = sounds[name];
        try {
            a.muted = true;
            var p = a.play();
            var done = function () {
                try {
                    a.pause();
                    a.currentTime = 0;
                    a.muted = false;
                } catch (e) {}
            };
            if (p && p.then) p.then(done, done); else done();
        } catch (e) {}
    });

    startSauna();
}

function onFirstGesture() {
    unlockAudio();
    if (soundEnabled) startSauna();
}

document.addEventListener("pointerdown", onFirstGesture, { passive: true });
document.addEventListener("touchend", onFirstGesture, { passive: true });

document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
        try { sounds.sauna.pause(); } catch (e) {}
    } else if (audioUnlocked && soundEnabled) {
        startSauna();
    }
});

/* ============================================================
   SCENES / FX
============================================================ */

function showScene(scene) {
    var all = document.querySelectorAll(".scene");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
    scene.classList.add("active");
}

function restartClass(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
}

function flashScreen() {
    restartClass(flash, "play");
}

function setSteamLevel(level) {
    steamLayer.classList.remove("level-20", "level-70", "level-100");
    if (level) steamLayer.classList.add("level-" + level);
}

function createParticles() {
    if (particlesCreated) return;
    particlesCreated = true;

    var frag = document.createDocumentFragment();

    for (var i = 0; i < PARTICLE_COUNT; i++) {
        var p = document.createElement("div");
        p.className = "particle";

        var size = 40 + Math.random() * 90;

        p.style.width  = size + "px";
        p.style.height = size + "px";
        p.style.left   = (Math.random() * 100) + "%";
        p.style.top    = (55 + Math.random() * 40) + "%";

        p.style.setProperty("--x",     ((Math.random() - .5) * 60) + "px");
        p.style.setProperty("--dur",   (3.5 + Math.random() * 4) + "s");
        p.style.setProperty("--delay", (Math.random() * 3) + "s");
        p.style.setProperty("--op",    (.25 + Math.random() * .45));

        frag.appendChild(p);
    }

    particlesEl.appendChild(frag);
}

function startParticles() {
    createParticles();
    var list = particlesEl.querySelectorAll(".particle");
    for (var i = 0; i < list.length; i++) list[i].classList.add("animate");
}

function steamParticleBurst() {
    var rect = game.getBoundingClientRect();
    var cx = rect.width * .38;
    var cy = rect.height * .76;
    var count = IS_MOBILE ? 12 : 18;

    for (var i = 0; i < count; i++) {
        (function () {
            var p = document.createElement("div");
            p.className = "steam-particle";
            p.style.left = cx + "px";
            p.style.top  = cy + "px";

            var angle = Math.random() * Math.PI * 2;
            var dist  = 60 + Math.random() * 180;
            var size  = (7 + Math.random() * 12) + "px";

            p.style.setProperty("--px", (Math.cos(angle) * dist) + "px");
            p.style.setProperty("--py", (Math.sin(angle) * dist - 100) + "px");
            p.style.width = size;
            p.style.height = size;

            steamBurst.appendChild(p);

            setTimeout(function () {
                if (p.parentNode) p.parentNode.removeChild(p);
            }, 900);
        })();
    }
}

/* ============================================================
   GAME FLOW
============================================================ */

function selectGirl(girl) {
    if (selectedGirl || steamPlaying) return;

    selectedGirl = girl;

    (girl === "a" ? girlAHit : girlBHit).classList.add("selected");

    tapA.classList.add("hide");
    tapB.classList.add("hide");

    playSound("select", .85);
    flashScreen();

    later(function () {
        showScene(girl === "a" ? girlAScene : girlBScene);
        setSteamLevel(20);
        startParticles();
    }, TRANSITION_DURATION);
}

function activateSteam() {
    if (!selectedGirl || steamPlaying) return;

    steamPlaying = true;

    var scene = selectedGirl === "a" ? girlAScene : girlBScene;
    var tap = scene.querySelector(".bucket-tap");
    if (tap) tap.classList.add("hide");

    playSound("select", .7);

    later(function () {

        if (!steamSoundPlayed) {
            playSound("steam", 1);
            steamSoundPlayed = true;
        }

        restartClass(steamBurst, "play");
        steamParticleBurst();

        restartClass(game, "shake");
        later(function () { game.classList.remove("shake"); }, 350);

        setSteamLevel(70);
        restartClass(steamLayer, "rising");

        startParticles();

        later(showFinalScene, STEAM_TO_70_DURATION + STEAM_HOLD_BEFORE_FINAL);

    }, 120);
}

function showFinalScene() {
    finalImage.src = selectedGirl === "a" ? IMAGES.scene3a : IMAGES.scene3b;

    finalUI.classList.remove("visible", "show-cta");

    flashScreen();
    showScene(finalScene);

    setSteamLevel(100);
    restartClass(steamLayer, "rising");

    startParticles();

    playSound("reaction", 1);
    setSaunaVolume(.10);

    later(function () { finalUI.classList.add("visible"); }, 250);
    later(function () { finalUI.classList.add("show-cta"); }, 750);
}

/* ============================================================
   CTA
============================================================ */

function openCTA() {
    if (ctaOpened) return;
    ctaOpened = true;

    try {
        if (typeof window.mraid !== "undefined" && typeof window.mraid.open === "function") {
            window.mraid.open(CTA_URL);
            later(function () { ctaOpened = false; }, 1200);
            return;
        }
    } catch (e) {}

    var w = null;
    try { w = window.open(CTA_URL, "_self"); } catch (e) {}

    if (!w) {
        try { window.location.href = CTA_URL; } catch (e) {}
    }

    later(function () { ctaOpened = false; }, 1200);
}

/* ============================================================
   EVENTS
============================================================ */

function bind(el, handler) {
    el.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        handler();
    });
}

bind(girlAHit, function () { selectGirl("a"); });
bind(girlBHit, function () { selectGirl("b"); });
bind(bucketA,  activateSteam);
bind(bucketB,  activateSteam);

ctaButton.addEventListener("click", function (e) {
    e.preventDefault();
    e.stopPropagation();
    openCTA();
});

soundButton.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();

    soundEnabled = !soundEnabled;
    soundButton.textContent = soundEnabled ? "🔊" : "🔇";

    if (soundEnabled) {
        if (audioUnlocked) startSauna();
    } else {
        Object.keys(sounds).forEach(function (k) {
            try { sounds[k].pause(); } catch (err) {}
        });
    }
});

document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("dragstart",   function (e) { e.preventDefault(); });

document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

/* ============================================================
   START
============================================================ */

preloadAll().then(function () {
    loader.classList.add("done");
    setTimeout(function () {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
    }, 500);
});

})();
</script>
